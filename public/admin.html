<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔧 Admin Panel — Düğün Fotoğrafları</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <!-- Login Screen -->
  <div class="login-overlay" id="login-overlay">
    <div class="login-card">
      <div class="login-icon">🔐</div>
      <h2>Admin Paneli</h2>
      <p>Düğün fotoğraflarını yönetin</p>
      <div class="login-form">
        <input type="password" id="admin-password" placeholder="Şifre girin..." autocomplete="off">
        <button class="btn-login" id="btn-login" onclick="login()">Giriş Yap</button>
      </div>
      <p class="login-error" id="login-error"></p>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard" style="display:none;">
    <header class="dash-header">
      <div class="dash-header-left">
        <h1>💒 Düğün Paneli</h1>
        <span class="live-badge" id="live-badge">● Canlı</span>
      </div>
      <div class="dash-header-right">
        <a href="/qr.html" class="btn-header" target="_blank">🖨️ QR Kodlar</a>
        <button class="btn-header btn-download" onclick="downloadAll()">📥 Tümünü İndir (ZIP)</button>
        <button class="btn-header btn-logout" onclick="logout()">Çıkış</button>
      </div>
    </header>

    <!-- Stats -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">📸</div>
        <div class="stat-value" id="stat-photos">0</div>
        <div class="stat-label">Fotoğraf</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🎬</div>
        <div class="stat-value" id="stat-videos">0</div>
        <div class="stat-label">Video</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📁</div>
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Toplam</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🪑</div>
        <div class="stat-value" id="stat-tables">0</div>
        <div class="stat-label">Aktif Masa</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-value" id="stat-guests">0</div>
        <div class="stat-label">Misafir</div>
      </div>
    </div>

    <!-- Table Filter -->
    <div class="filter-bar">
      <button class="filter-btn active" data-table="all" onclick="filterTable('all', this)">Tümü</button>
      <div class="filter-scroll" id="filter-scroll"></div>
    </div>

    <!-- Gallery -->
    <div class="gallery" id="gallery">
      <div class="gallery-empty" id="gallery-empty">
        <p>Henüz yükleme yapılmadı</p>
        <p class="gallery-empty-hint">Misafirler QR kodları okuttukça fotoğraflar burada görünecek</p>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" style="display:none;" onclick="closeLightbox(event)">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <div class="lightbox-content" id="lightbox-content"></div>
    <div class="lightbox-info" id="lightbox-info"></div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
