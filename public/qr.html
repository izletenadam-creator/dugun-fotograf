<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Kodlar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --gold: #d4a853;
      --gold-light: #f0d48a;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: #0a0a1a;
      color: #f5f0e8;
      padding: 20px;
    }

    .controls {
      max-width: 600px; margin: 0 auto 30px; text-align: center;
    }
    .controls h1 {
      font-family: var(--font-display); font-size: 1.8rem;
      color: var(--gold-light); margin-bottom: 16px;
    }
    .controls p { color: rgba(245,240,232,0.6); font-size: 0.85rem; margin-bottom: 20px; }

    .base-url-form {
      display: flex; gap: 8px; margin-bottom: 16px;
      background: rgba(255,255,255,0.06); border-radius: 12px; padding: 8px;
    }
    .base-url-form input {
      flex: 1; background: transparent; border: none; color: #f5f0e8;
      font-size: 0.9rem; padding: 8px 12px; outline: none; font-family: var(--font-body);
    }
    .base-url-form button {
      background: linear-gradient(135deg, var(--gold), #b8922e);
      color: #0a0a1a; border: none; border-radius: 8px; padding: 8px 20px;
      font-weight: 600; cursor: pointer; font-family: var(--font-body); font-size: 0.85rem;
    }

    .btn-print {
      background: linear-gradient(135deg, var(--gold), #b8922e);
      color: #0a0a1a; border: none; border-radius: 50px; padding: 12px 32px;
      font-size: 1rem; font-weight: 600; cursor: pointer; font-family: var(--font-body);
      margin-bottom: 8px;
    }
    .btn-print:hover { box-shadow: 0 4px 16px rgba(212,168,83,0.4); }
    .btn-zip { background: #1a1a2e; color: var(--gold); border: 1px solid var(--gold); margin-left: 10px; }
    .btn-zip:hover { background: var(--gold); color: #1a1a2e; }

    .qr-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px; max-width: 1200px; margin: 0 auto;
    }
    .qr-card {
      background: white; border-radius: 16px; padding: 24px;
      text-align: center; color: #1a1a2e;
    }
    .qr-card img { width: 180px; height: 180px; margin-bottom: 12px; }
    .qr-table-num {
      font-family: var(--font-display); font-size: 1.4rem; font-weight: 700;
      color: #1a1a2e; margin-bottom: 4px;
    }
    .qr-instruction {
      font-size: 0.75rem; color: #555; line-height: 1.4; margin: 8px 0;
    }
    .qr-instruction strong { color: #1a1a2e; font-size: 0.85rem; }
    .qr-url { font-size: 0.6rem; color: #999; margin-top: 8px; word-break: break-all; }

    .loading { text-align: center; padding: 60px; color: var(--gold); font-size: 1.1rem; }

    @media print {
      body { background: white; color: black; padding: 0; }
      .controls { display: none; }
      .qr-grid {
        grid-template-columns: repeat(3, 1fr); gap: 10px;
      }
      .qr-card {
        break-inside: avoid; page-break-inside: avoid;
        border: 1px solid #ddd; border-radius: 8px; padding: 16px;
      }
      .qr-card img { width: 150px; height: 150px; }
      .btn-download-qr { display: none !important; }
    }

    .btn-download-qr {
      display: inline-block; margin-top: 12px;
      background: rgba(212,168,83,0.1); border: 1px solid var(--gold);
      color: #1a1a2e; text-decoration: none; border-radius: 6px;
      padding: 6px 14px; font-size: 0.8rem; font-weight: 600;
      transition: all 0.3s;
    }
    .btn-download-qr:hover { background: var(--gold); color: white; }
  </style>
</head>
<body>
  <div class="controls">
    <h1 id="qr-title">QR Kodlar</h1>
    <p id="qr-desc">QR kodları yazdırıp ilgili alanlara yapıştırın. Her QR kod misafirin fotoğraf yükleme sayfasına yönlendirir.</p>
    <div class="base-url-form">
      <input type="text" id="base-url" placeholder="Base URL (örn: https://sizin-adresiniz.com)">
      <button onclick="generateQRs()">Oluştur</button>
    </div>
    <div>
      <button class="btn-print" onclick="window.print()">&#128424; Yazdır</button>
      <button class="btn-print btn-zip" onclick="downloadAllQRs()">&#128230; Hepsini İndir (ZIP)</button>
    </div>
  </div>

  <div class="qr-grid" id="qr-grid">
    <div class="loading" id="loading">QR kodlar yükleniyor...</div>
  </div>

  <script>
    const grid = document.getElementById('qr-grid');
    const baseUrlInput = document.getElementById('base-url');
    let qrConfig = null;

    // Set default base URL
    baseUrlInput.value = window.location.origin;

    // Fetch config then generate
    (async function init() {
      try {
        const res = await fetch('/api/config');
        qrConfig = await res.json();
        applyQRConfig(qrConfig);
      } catch (e) {
        console.error('Config fetch error:', e);
      }
      generateQRs();
    })();

    function applyQRConfig(cfg) {
      if (!cfg) return;
      const labels = cfg.labels || {};
      document.title = `QR Kodlar — ${cfg.eventName}`;
      document.getElementById('qr-title').textContent = `${labels.icon || ''} ${cfg.eventName}`.trim();
      document.getElementById('qr-desc').textContent =
        `${labels.zone || 'Masa'}lara yapıştırmak için QR kodları yazdırın. Her QR kod misafirin fotoğraf yükleme sayfasına yönlendirir.`;
    }

    async function generateQRs() {
      const baseUrl = baseUrlInput.value.trim() || window.location.origin;
      grid.innerHTML = '<div class="loading">QR kodlar oluşturuluyor...</div>';

      const zoneLabel = (qrConfig && qrConfig.labels && qrConfig.labels.zone) || 'Masa';
      const eventName = (qrConfig && qrConfig.eventName) || 'Etkinlik';
      const eventIcon = (qrConfig && qrConfig.labels && qrConfig.labels.icon) || '';

      try {
        const res = await fetch(`/api/admin/qr-codes?baseUrl=${encodeURIComponent(baseUrl)}`);
        const qrCodes = await res.json();
        window.currentQRs = qrCodes;

        grid.innerHTML = '';
        qrCodes.forEach(qr => {
          const card = document.createElement('div');
          card.className = 'qr-card';
          card.innerHTML = `
            <img src="${qr.qrDataUrl}" alt="${zoneLabel} ${qr.zoneNumber} QR">
            <div class="qr-table-num">${zoneLabel} ${qr.zoneNumber}</div>
            <div class="qr-instruction">
              <strong>📸 Anılarınızı Paylaşın!</strong><br>
              En güzel anları ölümsüzleştirmek için desteğine ihtiyacımız var.<br>
              QR'ı okut ve bizimle paylaş! ✨
            </div>
            <div class="qr-url">${qr.url}</div>
            <a href="${qr.qrDataUrl}" download="${zoneLabel}-${qr.zoneNumber}-QR.png" class="btn-download-qr">&#11015;&#65039; İndir</a>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        grid.innerHTML = '<div class="loading">Hata oluştu! Sunucu çalışıyor mu?</div>';
        console.error('QR generate error:', e);
      }
    }

    async function downloadAllQRs() {
      if (!window.currentQRs || window.currentQRs.length === 0) return alert('Önce QR kodları oluşturun.');
      const btn = document.querySelector('.btn-zip');
      btn.innerText = '⏳ Hazırlanıyor...';

      const zoneLabel = (qrConfig && qrConfig.labels && qrConfig.labels.zone) || 'Masa';

      try {
        const zip = new JSZip();
        window.currentQRs.forEach(qr => {
          const base64Data = qr.qrDataUrl.replace(/^data:image\/(png|jpeg|jpg);base64,/, "");
          zip.file(`${zoneLabel}-${qr.zoneNumber}-QR.png`, base64Data, {base64: true});
        });

        const content = await zip.generateAsync({type:"blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = "QR-Kodlari.zip";
        link.click();
      } catch (e) {
        console.error('ZIP error:', e);
        alert('İndirilirken bir hata oluştu.');
      }

      btn.innerText = '📦 Hepsini İndir (ZIP)';
    }
  </script>
</body>
</html>
